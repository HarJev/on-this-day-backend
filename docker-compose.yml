services:
  postgres:
    image: postgres:16-alpine
    container_name: on-this-day-postgres
    environment:
      POSTGRES_DB: on_this_day
      POSTGRES_USER: on_this_day
      POSTGRES_PASSWORD: on_this_day
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U on_this_day -d on_this_day"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
